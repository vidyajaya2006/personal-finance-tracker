<!DOCTYPE html>
<html>

<head>

    <title>Personal Finance Tracker</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <h1>Personal Finance Tracker</h1>

    <div class="summary">

        <div class="card">
            <h3>Total Income</h3>
            <p id="income">₹0</p>
        </div>

        <div class="card">
            <h3>Total Expense</h3>
            <p id="expense">₹0</p>
        </div>

        <div class="card">
            <h3>Balance</h3>
            <p id="balance">₹0</p>
        </div>

    </div>

    <h2>Add Transaction</h2>

    <input
        type="text"
        id="description"
        placeholder="Description"
    >

    <input
        type="number"
        id="amount"
        placeholder="Amount"
    >

    <select id="type">

        <option value="Income">
            Income
        </option>

        <option value="Expense">
            Expense
        </option>

    </select>

    <button type="button" onclick="addTransaction()">
        Add Transaction
    </button>

    <h2>Transaction History</h2>

    <ul id="transactionList"></ul>

</div>

<script src="script.js"></script>

</body>

</html>
